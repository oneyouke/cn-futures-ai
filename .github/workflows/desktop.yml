name: Windows desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python futures.py --test
      - name: Test desktop, CSV import and export
        run: python desktop.py --smoke-test source-smoke.txt
      - run: python -m pip install pyinstaller==6.22.2
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name FuturesDesk desktop.py
      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\FuturesDesk.exe" -ArgumentList "--smoke-test", "exe-smoke.txt" -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw "Packaged application timed out"
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path exe-smoke.txt)) {
            throw "Packaged desktop smoke test failed"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: FuturesDesk-Windows-x64
          path: dist/FuturesDesk.exe
          if-no-files-found: error
          retention-days: 30
